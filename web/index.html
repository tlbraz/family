<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f4fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16141d" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Family" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Family</title>
    <script>
      // If the app can't start, say why on screen instead of staying blank (and reload once for a missing file:
      // a page kept from before a deploy can ask for a script that no longer exists).
      var bootErrors = [];
      addEventListener('error', function (e) {
        var t = e.target;
        if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) {
          bootErrors.push('Could not load ' + (t.src || t.href));
          try {
            var last = Number(sessionStorage.getItem('family:reloaded') || 0);
            if (Date.now() - last < 30000) return;
            sessionStorage.setItem('family:reloaded', String(Date.now()));
          } catch (_) {}
          location.reload();
        } else {
          bootErrors.push((e.message || 'Error') + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : ''));
        }
      }, true);
      addEventListener('unhandledrejection', function (e) {
        bootErrors.push('Unhandled: ' + ((e.reason && e.reason.message) || e.reason));
      });
      window.showBootError = function (extra) {
        var root = document.getElementById('root');
        if (!root || root.querySelector('.boot-error')) return;
        if (extra) bootErrors.push(extra);
        root.innerHTML =
          '<div class="boot-error" style="padding:24px 20px;font-family:system-ui,sans-serif;color:#e8e6f0;background:#16141d;min-height:100vh">' +
          '<h2 style="margin:0 0 8px">The app didn\'t start</h2>' +
          '<p style="color:#a9a4bd;margin:0 0 12px">Send a screenshot of this to fix it.</p>' +
          '<pre style="white-space:pre-wrap;word-break:break-word;font-size:12px;background:#22202c;padding:12px;border-radius:10px"></pre>' +
          '<button style="margin-top:12px;padding:10px 16px;border-radius:12px;border:0;font-weight:700" onclick="location.reload()">Reload</button></div>';
        root.querySelector('pre').textContent =
          (bootErrors.join('\n') || 'No error was reported.') + '\n\n' + navigator.userAgent + '\n' + location.href + ' · ' + new Date().toISOString();
      };
      addEventListener('load', function () {
        setTimeout(function () {
          var root = document.getElementById('root');
          if (root && !root.children.length) window.showBootError('Nothing was drawn 5 s after loading.');
        }, 5000);
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
