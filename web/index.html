<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f4fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16141d" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Family" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Family</title>
    <script>
      // A page kept from before a deploy can ask for a script that no longer exists: reload once to get the new one.
      addEventListener('error', function (e) {
        var t = e.target;
        if (!t || (t.tagName !== 'SCRIPT' && t.tagName !== 'LINK')) return;
        try {
          var last = Number(sessionStorage.getItem('family:reloaded') || 0);
          if (Date.now() - last < 30000) return;
          sessionStorage.setItem('family:reloaded', String(Date.now()));
        } catch (_) {}
        location.reload();
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
