# Deployed by Coolify (build pack "Docker Compose"). Coolify generates
# SERVICE_PASSWORD_POSTGRES and passes SOURCE_COMMIT as a build arg; the domain is set on `app`.
services:
  app:
    build: .
    environment:
      DATABASE_URL: postgres://family:${SERVICE_PASSWORD_POSTGRES}@db:5432/family
      TZ: Europe/Lisbon
      # Optional features, each off until its value is set in Coolify:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}          # evening + Sunday digests
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}            # event from a photo or sentence
      GOOGLE_SERVICE_ACCOUNT: ${GOOGLE_SERVICE_ACCOUNT:-}  # shared "Family" Google Calendar (key JSON)
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-}          # optional; created automatically if empty
      OPS_TOKEN: ${OPS_TOKEN:-}                            # lets the ops session add events (acts as OPS_MEMBER, default Tiago)
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: family
      POSTGRES_USER: family
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
    volumes:
      - family-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U family -d family"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  family-pgdata:
